name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest tests/ -v

  # Runs the Makefile targets and the Docker container the way a new user would.
  make-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make setup
      - run: make data
      - run: make train
      - run: make lint
      - run: make test

      - name: make serve answers
        run: |
          make serve &
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf "localhost:8000/recommend/1?k=3" | grep -q personalized
          curl -sf localhost:8000/ | grep -q "Recommendation Engine"
          pkill -f "uvicorn src.serve" || true

      - name: make train-custom works on the movie sample
        run: make train-custom DATA=data/sample/ratings_sample.csv

      - name: make train again (restore the full model for Docker)
        run: make train

      - name: static export builds
        run: |
          venv/bin/python scripts/export_static.py --out site
          test -s site/data.json
          grep -q 'name="static-data"' site/index.html

      - name: docker answers
        run: |
          make docker-build
          docker image ls recommendation-engine
          make docker-run &
          for i in $(seq 1 90); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf "localhost:8000/recommend/1?k=3" | grep -q personalized
          curl -sf localhost:8000/static/genres/Comedy.png -o /dev/null
          docker ps -q | xargs -r docker stop

  # The exact image that Hugging Face will build, run on port 7860 like the Space does.
  space-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/huggingface/Dockerfile -t space-image .
      - run: docker image ls space-image
      - name: space image answers
        run: |
          docker run -d -p 7860:7860 --name space space-image
          for i in $(seq 1 60); do curl -sf localhost:7860/health && break; sleep 2; done
          curl -sf "localhost:7860/recommend/1?k=3" | grep -q personalized
          curl -sf localhost:7860/ | grep -q "Recommendation Engine"
          docker stop space
          docker rm space
          # Hosts such as Render set PORT themselves (default 10000); the image must follow it.
          docker run -d -e PORT=10000 -p 10000:10000 --name space-port space-image
          for i in $(seq 1 60); do curl -sf localhost:10000/health && break; sleep 2; done
          curl -sf "localhost:10000/recommend/1?k=3" | grep -q personalized
          docker stop space-port
